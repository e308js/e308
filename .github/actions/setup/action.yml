name: Set up e308 workspace
description: Install the pinned Node, pnpm, and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11.21.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24.14.1
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
