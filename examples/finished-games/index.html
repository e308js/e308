<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="e308 is a deterministic TypeScript toolkit for incremental and idle games."
    />
    <title>e308 — incremental game toolkit</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="site-head">
      <h1><strong>e308</strong><span>incremental game toolkit</span></h1>
      <nav aria-label="Choose game">
        <button type="button" data-game="wireworks">Wireworks</button>
        <button type="button" data-game="cascade">Cascade</button>
        <button type="button" data-game="hearth">Hearth</button>
      </nav>
    </header>
    <aside class="save-tools" aria-label="Save controls">
      <output id="host-status">Opening local save…</output>
      <button type="button" id="save">Save</button>
      <button type="button" id="export">Export</button>
      <button type="button" id="import">Import</button>
      <button type="button" id="reset">New save</button>
      <textarea id="save-data" aria-label="Exported save" rows="3"></textarea>
    </aside>
    <main id="game" class="game-shell" aria-live="polite"></main>
    <footer class="library-about">
      <p>
        e308 provides deterministic simulation, composable economies and progression, durable
        saves, offline advancement, bot players, pacing reports, and game-owned interfaces.
      </p>
      <div class="package-list" aria-label="Public packages">
        <code>@e308/core</code>
        <code>@e308/ux</code>
        <span>MIT licensed</span>
      </div>
    </footer>
    <script type="module" src="./dist/app.js?v=s10"></script>
  </body>
</html>
