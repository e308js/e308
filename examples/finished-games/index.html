<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>e308 finished games</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="site-head">
      <div><strong>e308</strong><span>finished-game proof</span></div>
      <nav aria-label="Choose game">
        <button type="button" data-game="wireworks">Wireworks</button>
        <button type="button" data-game="cascade">Cascade</button>
        <button type="button" data-game="hearth">Hearth</button>
      </nav>
    </header>
    <aside class="save-tools" aria-label="Save controls">
      <output id="host-status">Opening local save…</output>
      <button type="button" id="save">Save</button>
      <button type="button" id="export">Export</button>
      <button type="button" id="import">Import</button>
      <button type="button" id="reset">New save</button>
      <textarea id="save-data" aria-label="Exported save" rows="3"></textarea>
    </aside>
    <main id="game" class="game-shell" aria-live="polite"></main>
    <script type="module" src="./dist/app.js?v=s10"></script>
  </body>
</html>
